<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Olympics</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #e8edf5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 56px);
            text-align: center;
            padding: 32px;
        }
        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #0d1b6e;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        .hero p {
            font-size: 1.1rem;
            color: #546e7a;
            max-width: 480px;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="hero">
    <h1>&#10052; Winter Olympics</h1>
    <p>Athlete Management System</p>
</div>

</body>
</html>
